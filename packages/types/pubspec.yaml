name: cadence_types
description: >-
  The enums Cadence's wire contract is typed with — library types, media
  kinds, scan states — shared by cadence_media, cadence_client and every
  consumer of cadenced, so each name lives in one place. Pure Dart, no
  dependencies.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
resolution: workspace

dev_dependencies:
  test: ^1.25.0
