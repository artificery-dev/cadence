# Cadence CI: check the workspace, build cadenced for amd64, arm64 and armhf
# and package each as a bundle tarball and a Debian package, and check and
# build the Flutter desktop app for Linux amd64 with cadenced bundled.
#
# The runners are container-only (no docker socket, unprivileged), so every
# job runs inside an image: the shared toolbox
# (https://git.artificery.dev/artificery/toolbox), which carries the Dart
# SDK, Rust with the cross targets, the cross compilers, Flutter and the
# desktop build libraries. It is pinned by the first twelve characters of
# the toolbox commit that built it, on every `container: image:` line below
# (the container key cannot read `env`), so bump them together:
#
#   sed -i 's/toolbox:953dbb33881e/toolbox:<new>/' .forgejo/workflows/ci.yml
#
# The image is private to the instance, so jobs pull it with the workflow
# token (or the CI_FORGEJO_REGISTRY_* secrets when set). The workspace tool
# is compiled from source at the start of each job into build/bin/cadence.
#
# Pushes to `main` check and build everything without publishing. The `ci`
# branch exists to exercise this file end to end (main is mirrored
# publicly): every run on it, push or dispatch, goes all the way through to
# a disposable prerelease tagged `ci-test`, replaced each time. Real
# releases come from `v*` tags, whose version must match daemon/pubspec.yaml
# and app/pubspec.yaml, which move together.
name: CI

"on":
  push:
    branches: [main, ci]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DEB_MAINTAINER: Chris Hendrickson <chris@artificery.dev>

jobs:
  check:
    name: Analyze and test the daemon workspace
    runs-on: linux-amd64-container
    timeout-minutes: 45
    container:
      image: git.artificery.dev/artificery/toolbox:953dbb33881e
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Compile the workspace tool
        run: mkdir -p build/bin && dart compile exe tool/bin/cadence.dart -o build/bin/cadence
      # The daemon integration suites are off in CI for now: they spawn real
      # daemons and mounts, and on the shared runners they fail in ways the
      # same suites do not reproduce locally. Run `cadence check` locally.
      - name: Analyze and run the unit suites
        run: build/bin/cadence check --no-integration

  build:
    name: Build and package cadenced for ${{ matrix.arch }}
    # After check, not beside it: the amd64 runners share one host, and three
    # release builds next to the integration suites starved its daemons.
    needs: check
    runs-on: linux-amd64-container
    timeout-minutes: 45
    container:
      image: git.artificery.dev/artificery/toolbox:953dbb33881e
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine package version
        run: |
          set -eu
          base=$(sed -n 's/^version: *//p' daemon/pubspec.yaml)
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF#refs/tags/v}
              if [ "$version" != "$base" ]; then
                echo "::error::Tag v$version does not match daemon/pubspec.yaml version $base"
                exit 1
              fi
              ;;
            *)
              version="$base~git$(date -u +%Y%m%d).$(printf %.7s "$GITHUB_SHA")"
              ;;
          esac
          echo "CADENCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "DART_VERSION=$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([0-9.]*\).*/\1/p')" >> "$GITHUB_ENV"
          echo "Packaging version $version"
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Compile the workspace tool
        run: mkdir -p build/bin && dart compile exe tool/bin/cadence.dart -o build/bin/cadence
      - name: Build bundle
        run: build/bin/cadence build --arch ${{ matrix.arch }}
      # Some Dart SDKs have packaged an x86-64 launcher for cross builds, so
      # every shipped ELF file is checked against the target, not just listed.
      - name: Verify architecture
        run: |
          set -eu
          cd build/cli/${{ matrix.arch }}/bundle
          case "${{ matrix.arch }}" in
            amd64) want='x86-64' ;;
            arm64) want='aarch64' ;;
            armhf) want='ARM, EABI5' ;;
          esac
          for f in bin/cadenced bin/cadencectl lib/libsqlite3.so lib/libcadence_probe.so; do
            file "$f"
            file -b "$f" | grep -q "$want" || { echo "::error::$f is not built for ${{ matrix.arch }}"; exit 1; }
          done
      - name: Package bundle tarball
        run: |
          build/bin/cadence package bundle \
            --bundle build/cli/${{ matrix.arch }}/bundle \
            --arch ${{ matrix.arch }} \
            --source-commit "$GITHUB_SHA" \
            --dart-version "$DART_VERSION" \
            --output "build/dist/cadenced-${CADENCE_VERSION}-linux-${{ matrix.arch }}.tar.gz"
      - name: Package Debian archive
        run: |
          build/bin/cadence package deb \
            --bundle build/cli/${{ matrix.arch }}/bundle \
            --arch ${{ matrix.arch }} \
            --version "$CADENCE_VERSION" \
            --maintainer "$DEB_MAINTAINER" \
            --output build/dist
          dpkg-deb --info "build/dist/cadenced_${CADENCE_VERSION}_${{ matrix.arch }}.deb"
      - name: Save packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo-patched; numbered tags are unpatched mirrors)
        with:
          name: cadenced-${{ matrix.arch }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
          retention-days: 30
          if-no-files-found: error

  check-app:
    name: Analyze and test the desktop app
    # Beside the daemon's check and the app build, not after them: the
    # two app jobs are independent, like analysis and packaging are for
    # the daemon.
    runs-on: linux-amd64-container
    timeout-minutes: 60
    container:
      image: git.artificery.dev/artificery/toolbox:953dbb33881e
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Compile the workspace tool
        run: mkdir -p build/bin && dart compile exe tool/bin/cadence.dart -o build/bin/cadence
      - name: Analyze and test the app
        run: build/bin/cadence app check

  build-app:
    name: Build and package the desktop app for amd64
    runs-on: linux-amd64-container
    timeout-minutes: 60
    container:
      image: git.artificery.dev/artificery/toolbox:953dbb33881e
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Compile the workspace tool
        run: mkdir -p build/bin && dart compile exe tool/bin/cadence.dart -o build/bin/cadence
      - name: Determine package version
        run: |
          set -eu
          base=$(sed -n 's/^version: *//p' daemon/pubspec.yaml)
          app=$(sed -n 's/^version: *//p' app/pubspec.yaml | sed 's/+.*//')
          if [ "$app" != "$base" ]; then
            echo "::error::app/pubspec.yaml version $app does not match daemon/pubspec.yaml version $base"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF#refs/tags/v}
              if [ "$version" != "$base" ]; then
                echo "::error::Tag v$version does not match version $base"
                exit 1
              fi
              ;;
            *) version="$base~git$(date -u +%Y%m%d).$(printf %.7s "$GITHUB_SHA")" ;;
          esac
          echo "CADENCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Packaging version $version"
      - name: Build the app with cadenced bundled
        run: build/bin/cadence app build
      - name: Archive the app bundle
        run: |
          mkdir -p build/dist
          tar -C app/build/linux/x64/release -czf "build/dist/cadence-${CADENCE_VERSION}-linux-amd64.tar.gz" --transform 's,^bundle,cadence,' bundle
      - name: Package Debian archive
        run: |
          build/bin/cadence package app-deb \
            --bundle app/build/linux/x64/release/bundle \
            --version "$CADENCE_VERSION" \
            --maintainer "$DEB_MAINTAINER" \
            --output build/dist
          dpkg-deb --info "build/dist/cadence_${CADENCE_VERSION}_amd64.deb"
      - name: Save the app packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo-patched; numbered tags are unpatched mirrors)
        with:
          name: cadence-app-amd64
          path: |
            build/dist/cadence-*.tar.gz
            build/dist/cadence_*.deb
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build, check-app, build-app]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.ref == 'refs/heads/ci'
    runs-on: linux-amd64-container
    timeout-minutes: 15
    env:
      # A tag push releases as itself; any run on the `ci` branch publishes
      # a prerelease at the moving tag `ci-test`, replaced on every run.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci-test' }}
      PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
    steps:
      - name: Collect packages
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4 (Forgejo-patched)
        with:
          pattern: cadence*-*
          path: release
          merge-multiple: true
      - name: Create release with packages attached
        uses: https://data.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ env.RELEASE_TAG }}
          sha: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          override: ${{ env.PRERELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: release
          release-notes: cadenced ${{ env.RELEASE_TAG }} (${{ github.sha }}) for amd64, arm64 and armhf, as bundle tarballs and Debian packages, and the Cadence desktop app for Linux amd64 as a bundle tarball (cadenced inside) and a Debian package (which recommends cadenced).
