# Cadence CI: check the workspace, build cadenced for amd64, arm64 and armhf,
# and package each as a bundle tarball and a Debian package.
#
# The runners are container-only (no docker socket, unprivileged), so every
# job runs inside an image. The check and build jobs run inside the toolchain
# image from toolchain/Containerfile — which carries the AOT-compiled
# workspace tool as `cadence` — and this workflow builds that image with
# kaniko and pushes it to this Forgejo instance's container registry the
# first time a given toolchain/digest.sh value is seen; later runs find the
# tag and skip straight to using it.
#
# Pushing that image needs package write access, which Forgejo does not give
# the workflow token (GitHub's `permissions:` block is ignored here). The
# supported way is an Authorized Integration: the workflow requests a
# short-lived JWT (enable-openid-connect) and the registry accepts it as a
# Basic-auth password. One-time setup by the integration's owner:
#   1. User settings > Authorized Integrations > Add authorized integration
#      > Forgejo Actions (Local): select this repository, workflow file
#      `ci.yml`, git reference empty (ci, main, tags and PRs all build),
#      access "All (public, private, and limited)" with every permission
#      "No access" except package = "Read and write".
#   2. Store the audience it shows (not secret) as the repository variable
#      CADENCE_REGISTRY_AUDIENCE, e.g. `fj actions variables create
#      CADENCE_REGISTRY_AUDIENCE u:1:...`.
# Alternatively the CI_FORGEJO_REGISTRY_USERNAME / CI_FORGEJO_REGISTRY_TOKEN
# secrets (an access token with package scope) take precedence when set.
#
# The `ci` branch exists to exercise this file without touching main (main
# is mirrored publicly): pushes to it run every job short of the release,
# and a manual dispatch from it publishes a disposable prerelease tagged
# `ci-test` so the release path can be tried end to end. Real releases come
# from `v*` tags, whose version must match daemon/pubspec.yaml.
name: CI

"on":
  push:
    branches: [main, ci]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

enable-openid-connect: true

env:
  DEB_MAINTAINER: Chris Hendrickson <chris@artificery.dev>
  TOOLCHAIN_IMAGE: cadence-toolchain

jobs:
  toolchain:
    name: Resolve toolchain image
    runs-on: linux-amd64-container
    timeout-minutes: 10
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      exists: ${{ steps.resolve.outputs.exists }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image tag and look it up in the registry
        id: resolve
        env:
          REGISTRY_USERNAME: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          : "${GITHUB_SERVER_URL:?set by the instance; pass --forgejo-instance to forgejo-runner exec}"
          : "${GITHUB_REPOSITORY:?}"
          registry=$(printf %s "$GITHUB_SERVER_URL" | sed 's#^https\?://##')
          owner=$(printf %s "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          # The same digest toolchain/run.sh uses locally.
          digest=$(sh toolchain/digest.sh)
          image="$registry/$owner/$TOOLCHAIN_IMAGE:$digest"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$registry/v2/$owner/$TOOLCHAIN_IMAGE/manifests/$digest" || true)
          if [ "$status" = 200 ]; then exists=true; else exists=false; fi
          echo "Toolchain image $image (registry answered $status, exists=$exists)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  toolchain-build:
    name: Build and push toolchain image
    needs: toolchain
    if: needs.toolchain.outputs.exists != 'true'
    runs-on: linux-amd64-container
    timeout-minutes: 60
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      # kaniko's image has busybox (whose wget lacks TLS) but no git, curl or
      # node. Credentials are therefore obtained by a curl docker action,
      # which shares the job workspace, and kaniko clones the source itself
      # through its git context. Pushes pin the exact commit; a pull request
      # builds the tip of its source branch, since its merge commit is on no
      # branch.
      - name: Obtain registry credentials
        uses: docker://docker.io/curlimages/curl:8.22.0
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
          AUDIENCE: ${{ vars.CADENCE_REGISTRY_AUDIENCE }}
          REGISTRY_USERNAME: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          entrypoint: /bin/sh
          args: >-
            -eu -c '
            registry=${IMAGE%%/*}; path=${IMAGE#*/}; path=${path%%:*};
            if [ -n "$REGISTRY_TOKEN" ]; then
              user=$REGISTRY_USERNAME; pass=$REGISTRY_TOKEN; how="the CI_FORGEJO_REGISTRY_* secrets";
            elif [ -n "$AUDIENCE" ]; then
              : "${ACTIONS_ID_TOKEN_REQUEST_URL:?enable-openid-connect did not provide an ID token endpoint}";
              pass=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | sed -n "s/.*\"value\":\"\([^\"]*\)\".*/\1/p");
              [ -n "$pass" ] || { echo "::error::No JWT for audience $AUDIENCE; check the Authorized Integration restricts to this repository, ci.yml and this event"; exit 1; };
              user=$ACTOR; how="an Authorized Integration JWT (audience $AUDIENCE)";
            else
              echo "::error::No registry credentials: set the CADENCE_REGISTRY_AUDIENCE variable to an Authorized Integration with package write capability, or the CI_FORGEJO_REGISTRY_USERNAME / CI_FORGEJO_REGISTRY_TOKEN secrets."; exit 1;
            fi;
            status=$(curl -sS -o /dev/null -w "%{http_code}" -u "$user:$pass" "https://$registry/v2/token?service=container_registry&scope=repository:$path:pull,push");
            [ "$status" = 200 ] || { echo "::error::Registry $registry refused push credentials from $how (HTTP $status)"; exit 1; };
            echo "Registry $registry accepted push credentials from $how";
            printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" "$registry" "$(printf "%s:%s" "$user" "$pass" | base64 | tr -d "\n")" > "$GITHUB_WORKSPACE/.registry-auth.json"
            '
      - name: Build toolchain/Containerfile with kaniko and push
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
          SOURCE_SHA: ${{ github.head_ref && '' || github.sha }}
        run: |
          set -eu
          mkdir -p /kaniko/.docker
          mv "$GITHUB_WORKSPACE/.registry-auth.json" /kaniko/.docker/config.json
          context="git://${GITHUB_SERVER_URL#*://}/${GITHUB_REPOSITORY}.git#${SOURCE_REF}${SOURCE_SHA:+#$SOURCE_SHA}"
          echo "Building $IMAGE from $context"
          /kaniko/executor \
            --context "$context" \
            --dockerfile toolchain/Containerfile \
            --destination "$IMAGE" \
            --custom-platform linux/amd64 \
            --snapshot-mode redo \
            --compressed-caching=false

  check:
    name: Analyze and test
    needs: [toolchain, toolchain-build]
    if: >-
      always() && needs.toolchain.result == 'success'
      && (needs.toolchain-build.result == 'success' || needs.toolchain-build.result == 'skipped')
    runs-on: linux-amd64-container
    timeout-minutes: 45
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Analyze and run every suite
        run: cadence check

  build:
    name: Build ${{ matrix.arch }}
    # After check, not beside it: the amd64 runners share one host, and three
    # release builds next to the integration suites starved its daemons.
    needs: [toolchain, toolchain-build, check]
    if: >-
      always() && needs.toolchain.result == 'success'
      && (needs.toolchain-build.result == 'success' || needs.toolchain-build.result == 'skipped')
      && needs.check.result == 'success'
    runs-on: linux-amd64-container
    timeout-minutes: 45
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ secrets.CI_FORGEJO_REGISTRY_USERNAME || github.actor }}
        password: ${{ secrets.CI_FORGEJO_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine package version
        run: |
          set -eu
          base=$(sed -n 's/^version: *//p' daemon/pubspec.yaml)
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF#refs/tags/v}
              if [ "$version" != "$base" ]; then
                echo "::error::Tag v$version does not match daemon/pubspec.yaml version $base"
                exit 1
              fi
              ;;
            *)
              version="$base~git$(date -u +%Y%m%d).$(printf %.7s "$GITHUB_SHA")"
              ;;
          esac
          echo "CADENCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "DART_VERSION=$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([0-9.]*\).*/\1/p')" >> "$GITHUB_ENV"
          echo "Packaging version $version"
      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Build bundle
        run: cadence build --arch ${{ matrix.arch }}
      - name: Verify architecture
        run: |
          cd build/cli/${{ matrix.arch }}/bundle
          file bin/cadenced bin/cadencectl lib/libsqlite3.so lib/libcadence_probe.so
      - name: Package bundle tarball
        run: |
          cadence package bundle \
            --bundle build/cli/${{ matrix.arch }}/bundle \
            --arch ${{ matrix.arch }} \
            --source-commit "$GITHUB_SHA" \
            --dart-version "$DART_VERSION" \
            --output "build/dist/cadenced-${CADENCE_VERSION}-linux-${{ matrix.arch }}.tar.gz"
      - name: Package Debian archive
        run: |
          cadence package deb \
            --bundle build/cli/${{ matrix.arch }}/bundle \
            --arch ${{ matrix.arch }} \
            --version "$CADENCE_VERSION" \
            --maintainer "$DEB_MAINTAINER" \
            --output build/dist
          dpkg-deb --info "build/dist/cadenced_${CADENCE_VERSION}_${{ matrix.arch }}.deb"
      - name: Save packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (Forgejo-patched; numbered tags are unpatched mirrors)
        with:
          name: cadenced-${{ matrix.arch }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.deb
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci')
    runs-on: linux-amd64-container
    timeout-minutes: 15
    env:
      # A tag push releases as itself; a dispatch from `ci` publishes a
      # prerelease at the moving tag `ci-test`, replaced on every run.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci-test' }}
      PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
    steps:
      - name: Collect packages
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4 (Forgejo-patched)
        with:
          pattern: cadenced-*
          path: release
          merge-multiple: true
      - name: Create release with packages attached
        uses: https://data.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ env.RELEASE_TAG }}
          sha: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE }}
          override: ${{ env.PRERELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: release
          release-notes: cadenced ${{ env.RELEASE_TAG }} (${{ github.sha }}) for amd64, arm64 and armhf, as bundle tarballs and Debian packages.
